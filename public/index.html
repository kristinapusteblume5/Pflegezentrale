<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pflegezentrale</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pflegezentrale">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--br:#e6e8ec;--ac:#0f766e;--acx:#fff;--wa:#b45309;--er:#b42318;--ok:#15803d;--chip:#eef1f4;
--t0:#dbeafe;--t0x:#1e40af;--t1:#ede9fe;--t1x:#5b21b6;--t2:#dcfce7;--t2x:#166534;--t3:#e5e7eb;--t3x:#374151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1214;--card:#171b1e;--tx:#eef1f3;--mu:#98a2ab;--br:#262c31;--ac:#4fd1b8;--acx:#06201b;--wa:#e0a04a;--er:#f0877d;--ok:#6cc596;--chip:#20262a;
--t0:#1e3a5f;--t0x:#9cc4ff;--t1:#3b2a63;--t1x:#c9b6ff;--t2:#16402a;--t2x:#8fe0b0;--t3:#2a3036;--t3x:#c4ccd3}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 16px;z-index:5;border-bottom:1px solid var(--br)}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
main{padding:4px 16px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px}
h1.pt{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{font-size:11px;background:var(--chip);color:var(--mu);border-radius:99px;padding:1px 8px;margin-left:6px;font-weight:500}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.mu{color:var(--mu);font-size:13px}.warn{color:var(--wa)}.err{color:var(--er)}.ok{color:var(--ok)}
button,select,input,textarea{font:inherit;font-size:14px;color:var(--tx)}
button{min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--br);background:var(--card);cursor:pointer;font-weight:500}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.s{min-height:30px;padding:3px 10px;font-size:13px}
button.gh{border-color:transparent;background:none;color:var(--mu)}
button.dg{background:var(--er);color:#fff;border-color:var(--er)}
input,select,textarea{width:100%;min-height:40px;padding:7px 10px;border-radius:10px;border:1px solid var(--br);background:var(--card)}
textarea{min-height:130px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.tabs{display:flex;gap:2px;margin:4px 0 14px;overflow-x:auto;border-bottom:1px solid var(--br)}
.tabs button{border:0;border-radius:0;background:none;min-height:38px;padding:6px 12px;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
.chips{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto}
.chips button{min-height:30px;padding:3px 11px;font-size:13px;border-radius:99px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--br);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;padding:6px 2px;color:var(--mu);min-height:50px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:18px;line-height:1}
nav button[aria-current=true]{color:var(--ac);font-weight:700}
.hero{margin:12px 0 4px;border-radius:18px;aspect-ratio:4/3;max-height:380px;background-size:cover;background-position:50% 28%;display:flex;align-items:flex-end;padding:16px;color:#fff;border:1px solid var(--br)}
.hn{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.45)}.hs{font-size:13px;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--br);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--br);vertical-align:top}
.wrap{overflow-x:auto}
a.call{display:inline-flex;align-items:center;min-height:34px;padding:5px 12px;border-radius:10px;background:var(--ac);color:var(--acx);text-decoration:none;font-weight:600;font-size:14px}
a.call.alt{background:var(--chip);color:var(--tx)}
.note{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--chip);border-radius:6px;font-size:14px}
.cf{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:13px}
.ss{min-height:26px;width:auto;font-size:12px;padding:1px 8px;border-radius:99px;flex:none;font-weight:600}.ss.ac{border-color:var(--ac);color:var(--ac)}.ss.wa{border-color:var(--wa);color:var(--wa)}.ss.ok{border-color:var(--ok);color:var(--ok)}
.tk{padding:10px 12px;cursor:pointer}.mu2{font-size:12px;color:var(--mu);margin:12px 0 2px;font-weight:600}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.t0{background:var(--t0);color:var(--t0x)}.t1{background:var(--t1);color:var(--t1x)}.t2{background:var(--t2);color:var(--t2x)}.t3{background:var(--t3);color:var(--t3x)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.t0{background:var(--t0x)}.dot.t1{background:var(--t1x)}.dot.t2{background:var(--t2x)}.dot.t3{background:var(--t3x)}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--chip);font-size:11px;font-weight:700;color:var(--mu)}
.hero.sm{aspect-ratio:auto;height:150px;background-position:50% 22%;margin-top:10px}
</style>
</head>
<body>
<header><div class="row sp"><div><span class="brand">Pflegezentrale</span></div><div class="row" id="hu" style="gap:4px"></div></div></header>
<main id="v"></main>
<nav id="nv" hidden><div id="nav"></div></nav>
<noscript><p style="padding:16px">Diese App braucht JavaScript.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
