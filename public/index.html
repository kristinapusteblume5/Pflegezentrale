<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pflegezentrale</title>
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pflegezentrale">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* ---------- Grundwerte ---------- */
:root{
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f6f5f2;--card:#fff;--sunk:#efece4;--tx:#1c1a18;--mu:#6a655e;--br:#e3dfd5;--br2:#eeeae1;
 --ac:#1c1a18;--acx:#fff;--acs:#ebe6da;--wa:#8a5a0c;--was:#f7ead0;--er:#9c3524;--ers:#f7e0da;--ok:#3f6b45;--chip:#efeae0;
 --p1:#9c5a3c;--p1s:#f0ddcd;--p2:#3b6b8c;--p2s:#dde9f3;
 --av1:#ebc6ac;--av1x:#6b3a20;--av2:#bbd7ea;--av2x:#1f4c6b;
 --t0:#dce8f2;--t0x:#2f5775;--t1:#e6dff1;--t1x:#5c4079;--t2:#dceadd;--t2x:#36613c;--t3:#e2ded4;--t3x:#5a534c;
 --sh:0 1px 2px rgba(35,32,30,.05),0 1px 1px rgba(35,32,30,.03);
 --shx:0 -8px 32px rgba(35,32,30,.16);
 --pill:#f7f4ec;
 --f1:11px;--f2:12px;--f3:13px;--f4:15px;--f5:17px;--f6:20px;--f7:24px;--f8:30px;
 --r:16px;--sp:16px
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#17150f;--card:#201e1a;--sunk:#1a1814;--tx:#edeae3;--mu:#9d968b;--br:#322e28;--br2:#2a2722;
 --ac:#efece5;--acx:#1c1a18;--acs:#2b2823;--wa:#dfa64c;--was:#2e2719;--er:#ef8b79;--ers:#32211d;--ok:#7fc98f;--chip:#282520;
 --p1:#d79c7c;--p1s:#2e2520;--p2:#8fbedc;--p2s:#1e262d;
 --av1:#6b4330;--av1x:#f0cdb5;--av2:#2c4e66;--av2x:#bedcee;
 --t0:#1f2c38;--t0x:#9fc4e2;--t1:#2b2439;--t1x:#c3add9;--t2:#1d2c20;--t2x:#95c79c;--t3:#2a2722;--t3x:#b6aea4;
 --pill:rgba(255,255,255,.1);
 --sh:0 1px 2px rgba(0,0,0,.4);--shx:0 -8px 32px rgba(0,0,0,.5)}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
html,body{margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);
 font:400 var(--f4)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
 max-width:640px;margin:0 auto;padding-bottom:92px;-webkit-font-smoothing:antialiased;
 font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
::selection{background:var(--acs)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}

/* ---------- Kopf und Navigation ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);
 padding:9px var(--sp);z-index:20;border-bottom:1px solid var(--br2)}
.brand{font-size:var(--f4);font-weight:650;letter-spacing:.01em;color:var(--mu)}
.brand b{color:var(--tx);font-weight:650}
main{padding:0 var(--sp) 8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
 border-top:1px solid var(--br);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:var(--f1);font-weight:550;letter-spacing:.005em;
 padding:7px 1px 6px;color:var(--mu);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-current=true]{color:var(--ac);font-weight:700}
nav .nb{position:absolute;top:4px;left:50%;margin-left:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
 background:var(--ac);color:var(--acx);font-size:10px;font-weight:700;line-height:17px;text-align:center}
nav .nb.w{background:var(--wa);color:#fff}

/* ---------- Typografie ---------- */
.ph2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 10px}
h1.pt{font-size:var(--f7);line-height:1.16;font-weight:700;letter-spacing:-.025em;margin:0}
h2{font-size:var(--f4);line-height:1.3;font-weight:650;letter-spacing:-.01em;color:var(--tx);
 margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .n{color:var(--mu);font-weight:500}
.mu{color:var(--mu);font-size:var(--f3);line-height:1.45}
.warn{color:var(--wa)}.err{color:var(--er)}.ok{color:var(--ok)}
b,strong{font-weight:650}
.lead{font-size:var(--f4);color:var(--mu);margin:2px 0 14px;max-width:46ch}

/* ---------- Flächen und Listen ---------- */
.card{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh)}
.list{background:var(--card);border:1px solid var(--br);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin:10px 0}
.list>.card{border:0;border-radius:0;margin:0;box-shadow:none;background:none}
.list>.card+.card{border-top:1px solid var(--br2)}
.list>.card.tk:active{background:var(--sunk)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tk{cursor:pointer}
.empty{background:var(--card);border:1px dashed var(--br);border-radius:var(--r);padding:20px 16px;margin:10px 0;color:var(--mu);font-size:var(--f3)}
.empty b{display:block;color:var(--tx);font-size:var(--f4);margin-bottom:3px}

/* ---------- Bedienelemente ---------- */
button,select,input,textarea{font-family:inherit;color:var(--tx)}
button{font-size:var(--f4);min-height:40px;padding:8px 14px;border-radius:11px;border:1px solid var(--br);
 background:var(--card);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
 transition:background .12s ease,border-color .12s ease}
button svg{width:17px;height:17px;flex:none}
button:active{background:var(--sunk)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);box-shadow:var(--sh)}
button.p:active{filter:brightness(.93)}
button.s{min-height:34px;padding:5px 11px;font-size:var(--f3);border-radius:9px}
button.s svg{width:15px;height:15px}
button.gh{border-color:transparent;background:none;color:var(--mu);box-shadow:none}
button.gh:active{background:var(--chip)}
button.dg{background:var(--er);color:#fff;border-color:var(--er)}
button.ic{min-height:36px;min-width:36px;padding:6px;border-color:transparent;background:none;color:var(--mu);border-radius:10px}
button.ic:active{background:var(--chip)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;font-size:16px;line-height:1.35;
 border-radius:11px;border:1px solid var(--br);background:var(--card);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px var(--acs)}
textarea{min-height:120px;resize:vertical}
.srch{position:relative;margin:2px 0 10px}
.srch svg{position:absolute;left:12px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--mu);pointer-events:none}
.srch input{padding-left:38px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);
 background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
label{display:block;font-size:var(--f3);font-weight:600;color:var(--mu);margin:14px 0 5px}
label.ck{display:flex;align-items:center;gap:10px;font-size:var(--f4);color:var(--tx);font-weight:500;margin:0 0 4px}
label.ck input{width:20px;min-height:20px;height:20px;flex:none;appearance:auto;-webkit-appearance:checkbox}
.fg{display:flex;gap:10px}.fg>*{flex:1;min-width:0}

/* ---------- Reiter und Filter ---------- */
.tabs{display:flex;gap:4px;margin:4px -16px 14px;padding:0 16px;overflow-x:auto;scrollbar-width:none;
 border-bottom:1px solid var(--br);scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;border-radius:0;background:none;min-height:42px;padding:8px 3px;margin-right:16px;font-size:var(--f4);
 font-weight:550;color:var(--mu);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;scroll-snap-align:start}
.tabs button:last-child{margin-right:0}
.tabs button sup{font-size:var(--f1);font-weight:700;line-height:0;vertical-align:super;margin-left:2px;opacity:.55}
.tabs button[aria-selected=true] sup{opacity:1;color:var(--ac)}
.tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--ac);font-weight:700}
.tabs button:active{background:none;opacity:.6}
.chips{display:flex;gap:7px;margin:0 -16px 10px;padding:2px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{min-height:34px;padding:5px 13px;font-size:var(--f3);font-weight:550;border-radius:99px;white-space:nowrap;background:var(--card)}
.chips button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:650}
.chips button[aria-pressed=true] .dot{background:currentColor;opacity:.75}

/* ---------- Marken, Status, Personen ---------- */
.badge{font-size:var(--f2);font-weight:600;padding:2.5px 9px;border-radius:99px;border:1px solid var(--br);background:var(--sunk);color:var(--mu);white-space:nowrap}
.tg.wa{background:var(--was);color:var(--wa)}
.badge.ok{background:var(--t2);color:var(--t2x);border-color:transparent}
.badge.ac{background:var(--t0);color:var(--t0x);border-color:transparent}
.badge.wa{background:var(--was);color:var(--wa);border-color:transparent}
.badge.er{background:var(--ers);color:var(--er);border-color:transparent}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:var(--f2);font-weight:650;padding:3px 9px;border-radius:99px;letter-spacing:.005em}
.tg svg{width:12px;height:12px}
.t0{background:var(--t0);color:var(--t0x)}.t1{background:var(--t1);color:var(--t1x)}.t2{background:var(--t2);color:var(--t2x)}.t3{background:var(--t3);color:var(--t3x)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:1px;flex:none}
.dot.c0,.dot.c1,.dot.c2,.dot.c3,.dot.c4{background:var(--fx)}
.dot.t0{background:var(--t0x)}.dot.t1{background:var(--t1x)}.dot.t2{background:var(--t2x)}.dot.t3{background:var(--t3x)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:var(--f1);font-weight:700;
 background:var(--chip);color:var(--mu);border:1.5px solid var(--card)}
.av.a1{background:var(--av1);color:var(--av1x)}
.av.a2{background:var(--av2);color:var(--av2x)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-7px}
.ss{min-height:32px;width:auto;flex:none;font-size:var(--f3);font-weight:650;padding:4px 26px 4px 11px;border-radius:99px;
 background-color:var(--sunk);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px,4px 4px}
.ss.ac{background-color:var(--t0);color:var(--t0x);border-color:transparent}
.ss.wa{background-color:var(--was);color:var(--wa);border-color:transparent}
.ss.ok{background-color:var(--t2);color:var(--t2x);border-color:transparent}

/* ---------- Bausteine ---------- */
a.call{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 13px;border-radius:11px;
 background:var(--acs);color:var(--ac);border:1px solid var(--br);text-decoration:none;font-weight:650;font-size:var(--f4)}
a.call svg{width:16px;height:16px;opacity:.85}
a.call.alt{background:var(--sunk);color:var(--mu);border-color:var(--br)}
a.call:active{filter:brightness(.95)}
a.lnk{display:inline-flex;align-items:center;gap:6px;min-height:34px;color:var(--mu);
 text-decoration:none;font-weight:600;font-size:var(--f3)}
a.lnk svg{width:15px;height:15px}
a.lnk:active{color:var(--ac)}
.note{border-left:2.5px solid var(--br);padding:3px 0 3px 12px;margin:12px 0;font-size:var(--f4);line-height:1.5}
.note.me{border-left-color:var(--p1)}
.note .nh{font-size:var(--f2);color:var(--mu);margin-bottom:2px;font-weight:600}
.cf{margin-top:10px;padding:12px;border-radius:12px;background:var(--ers);border:1px solid var(--er);font-size:var(--f3);color:var(--tx)}
.ed{margin:12px -14px -14px;padding:14px;background:var(--sunk);border-top:1px solid var(--br2)}
.ed>label:first-child{margin-top:0}
.blk .ed{margin:14px -16px -14px;border-radius:0 0 18px 18px;background:var(--pill);border-top-color:transparent}
.alert{background:var(--was);border:1px solid var(--wa);border-radius:var(--r);padding:12px 14px;margin:10px 0;font-size:var(--f3)}
.alert b{font-size:var(--f4)}
.card.att{border-color:var(--wa)}
table{width:100%;border-collapse:collapse;font-size:var(--f3)}
th{text-align:left;padding:8px 10px;font-weight:650;font-size:var(--f2);color:var(--mu);background:var(--sunk);white-space:nowrap}
td{text-align:left;padding:10px;border-top:1px solid var(--br2);vertical-align:top}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hero{position:relative;margin:14px 0 4px;border-radius:20px;height:132px;background-size:cover;background-position:50% 24%;
 display:flex;align-items:flex-end;padding:16px;color:#fff;overflow:hidden}
.hn{font-size:var(--f7);font-weight:700;letter-spacing:-.025em;line-height:1.1;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.hs{font-size:var(--f3);opacity:.95;margin-top:1px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.kv{display:flex;gap:10px;font-size:var(--f3);padding:7px 0;border-top:1px solid var(--br2)}
.kv:first-child{border-top:0}
.kv dt{color:var(--mu);flex:none;width:104px}
.kv dd{margin:0;flex:1;min-width:0}

/* ---------- Farbige Blöcke: die Farbe sagt, worum es geht ---------- */
.blk{--f:var(--t3);--fx:var(--t3x);background:var(--f);border-radius:18px;padding:14px 16px;margin:10px 0}
.blk.tk{cursor:pointer}
.blk.tk:active{filter:brightness(.97)}
.c0,.k-immo{--f:var(--t0);--fx:var(--t0x)}
.c1,.k-wohnen{--f:var(--t1);--fx:var(--t1x)}
.c2,.k-arzt{--f:var(--t2);--fx:var(--t2x)}
.c3,.k-sonst{--f:var(--t3);--fx:var(--t3x)}
.c4{--f:var(--p1s);--fx:var(--p1)}
.k-sonst{--f:var(--p1s);--fx:var(--p1)}
.blk.old{opacity:.62}
.blk.due{box-shadow:inset 0 0 0 2px var(--wa)}
.blk.big{padding:18px}
.blk .mu{color:var(--fx);opacity:.82}
.blk .mu svg{width:14px;height:14px}
.blk .lnk{color:var(--fx);opacity:.82}
.blk .av{border-color:var(--f)}
.blk .ss{background-color:var(--pill);border-color:transparent;color:var(--fx)}
.blk .ss.wa{color:var(--wa)}
.blk .tg{background:var(--pill);color:var(--fx)}
.apt{font-size:var(--f5);font-weight:700;letter-spacing:-.02em;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.blk.big .apt{font-size:var(--f6);letter-spacing:-.025em}
.apw{font-size:var(--f3);font-weight:650;color:var(--fx);margin-top:4px}
.blk.big .apw{font-size:var(--f4)}
.rel{flex:none;font-size:var(--f2);font-weight:650;padding:3.5px 10px;border-radius:99px;background:var(--pill);color:var(--fx);white-space:nowrap}
.ini{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;
 background:var(--f);color:var(--fx);font-size:var(--f4);font-weight:700}
.ini svg{width:18px;height:18px}
.ttl{font-size:var(--f5);font-weight:650;letter-spacing:-.015em;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ttl-l{font-size:var(--f6);font-weight:700;letter-spacing:-.025em;line-height:1.2;min-width:0}
.num{font-size:var(--f7);font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--fx)}

/* ---------- Blatt von unten ---------- */
.shbg{position:fixed;inset:0;background:rgba(28,25,23,.42);z-index:40;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;z-index:41;
 background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shx);
 max-height:88vh;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.22,1,.36,1)}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--br2)}
.shh b{font-size:var(--f5);font-weight:650;letter-spacing:-.015em}
.shb{flex:1;min-height:0;padding:4px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shb>label:first-child{margin-top:8px}
.shf{flex:none;background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
 border-top:1px solid var(--br2);border-radius:0 0 22px 22px}
.shf button{width:100%;min-height:48px;font-size:var(--f4)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Rückmeldung ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(72px + env(safe-area-inset-bottom,0px));
 z-index:50;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:var(--f4);font-weight:600;
 box-shadow:0 6px 24px rgba(35,32,30,.28);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
 display:inline-flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:16px;height:16px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="row sp"><div class="brand"><b>Pflegezentrale</b></div><div class="row" id="hu" style="gap:2px"></div></div></header>
<main id="v"></main>
<nav id="nv" hidden><div id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">Diese App braucht JavaScript.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
