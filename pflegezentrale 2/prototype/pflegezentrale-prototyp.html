<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pflegezentrale – Prototyp</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--br:#e6e8ec;--ac:#0f766e;--acx:#fff;--wa:#b45309;--er:#b42318;--ok:#15803d;--chip:#eef1f4;
--t0:#dbeafe;--t0x:#1e40af;--t1:#ede9fe;--t1x:#5b21b6;--t2:#dcfce7;--t2x:#166534;--t3:#e5e7eb;--t3x:#374151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1214;--card:#171b1e;--tx:#eef1f3;--mu:#98a2ab;--br:#262c31;--ac:#4fd1b8;--acx:#06201b;--wa:#e0a04a;--er:#f0877d;--ok:#6cc596;--chip:#20262a;
--t0:#1e3a5f;--t0x:#9cc4ff;--t1:#3b2a63;--t1x:#c9b6ff;--t2:#16402a;--t2x:#8fe0b0;--t3:#2a3036;--t3x:#c4ccd3}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 16px;z-index:5;border-bottom:1px solid var(--br)}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
main{padding:4px 16px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px}
h1.pt{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{font-size:11px;background:var(--chip);color:var(--mu);border-radius:99px;padding:1px 8px;margin-left:6px;font-weight:500}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.mu{color:var(--mu);font-size:13px}.warn{color:var(--wa)}.err{color:var(--er)}.ok{color:var(--ok)}
button,select,input,textarea{font:inherit;font-size:14px;color:var(--tx)}
button{min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--br);background:var(--card);cursor:pointer;font-weight:500}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.s{min-height:30px;padding:3px 10px;font-size:13px}
button.gh{border-color:transparent;background:none;color:var(--mu)}
button.dg{background:var(--er);color:#fff;border-color:var(--er)}
input,select,textarea{width:100%;min-height:40px;padding:7px 10px;border-radius:10px;border:1px solid var(--br);background:var(--card)}
textarea{min-height:130px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.tabs{display:flex;gap:2px;margin:4px 0 14px;overflow-x:auto;border-bottom:1px solid var(--br)}
.tabs button{border:0;border-radius:0;background:none;min-height:38px;padding:6px 12px;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
.chips{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto}
.chips button{min-height:30px;padding:3px 11px;font-size:13px;border-radius:99px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--br);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;padding:6px 2px;color:var(--mu);min-height:50px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:18px;line-height:1}
nav button[aria-current=true]{color:var(--ac);font-weight:700}
.hero{margin:12px 0 4px;border-radius:18px;aspect-ratio:4/3;max-height:380px;background-size:cover;background-position:50% 28%;display:flex;align-items:flex-end;padding:16px;color:#fff;border:1px solid var(--br)}
.hn{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.45)}.hs{font-size:13px;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--br);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--br);vertical-align:top}
.wrap{overflow-x:auto}
a.call{display:inline-flex;align-items:center;min-height:34px;padding:5px 12px;border-radius:10px;background:var(--ac);color:var(--acx);text-decoration:none;font-weight:600;font-size:14px}
a.call.alt{background:var(--chip);color:var(--tx)}
.note{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--chip);border-radius:6px;font-size:14px}
.cf{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:13px}
.ss{min-height:26px;width:auto;font-size:12px;padding:1px 8px;border-radius:99px;flex:none;font-weight:600}.ss.ac{border-color:var(--ac);color:var(--ac)}.ss.wa{border-color:var(--wa);color:var(--wa)}.ss.ok{border-color:var(--ok);color:var(--ok)}
.tk{padding:10px 12px;cursor:pointer}.mu2{font-size:12px;color:var(--mu);margin:12px 0 2px;font-weight:600}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.t0{background:var(--t0);color:var(--t0x)}.t1{background:var(--t1);color:var(--t1x)}.t2{background:var(--t2);color:var(--t2x)}.t3{background:var(--t3);color:var(--t3x)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.t0{background:var(--t0x)}.dot.t1{background:var(--t1x)}.dot.t2{background:var(--t2x)}.dot.t3{background:var(--t3x)}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--chip);font-size:11px;font-weight:700;color:var(--mu)}
</style>
</head>

function vDx(){const nav=tabs([['overview','Übersicht'],...dxs.map(a=>[a.id,esc(a.n.replace(' (Beispiel)',''))])],dxTab,'dt');
 if(dxTab==='overview')return nav+dxOver();
 if(dxTab==='new')return nav+`<div class="card"><label style="margin-top:0" for="na">Thema oder Diagnose-Cluster</label><input id="na" placeholder="z. B. Diabetes"><button class="p" data-newa="1" style="margin-top:12px">Anlegen</button><div class="mu" style="margin-top:8px">Neue Einträge starten als „unbestätigt“.</div></div>`;
 const a=dxs.find(x=>x.id===dxTab);if(!a){dxTab='overview';return vDx()}
 const sub=tabs([['info','Überblick'],['bef',`Befunde (${a.bef.length})`],['notes',`Notizen (${a.notes.length})`]],dxSub,'ds');
 const head=`<div class="row sp" style="margin:0 0 8px;flex-wrap:nowrap"><div class="row"><b style="font-size:17px">${esc(a.n)}</b><span class="badge ${a.st==='unbestätigt'?'warn':''}">${a.st}</span></div><button class="s gh" data-del="d:${a.id}" aria-label="Diagnose löschen">🗑 Löschen</button></div>
 ${del==='d:'+a.id?confirmBox(`Diagnose „${esc(a.n)}“ mit ${a.bef.length} Befunden und ${a.notes.length} Notizen wirklich löschen?`):''}`;
 let b='';
 if(dxSub==='info'){const tl=[...a.notes.map(n=>({d:n.d,h:`<div class="note"><b>Notiz</b> · ${esc(n.u)} · ${fmt(n.d)}<br>${esc(n.t)}</div>`})),...a.bef.map(x=>({d:x.d,h:`<div class="note"><b>${esc(x.ty)}</b> · ${fmt(x.d)}<br>${esc(x.t)}</div>`}))].sort((x,y)=>y.d-x.d);
  b=`<div class="card"><label style="margin-top:0">Status</label><select id="d_st">${opts(DST,a.st)}</select><label>Behandelnder Arzt</label><select id="d_arzt">${opts(['–',...contacts.filter(c=>c.cl==='Ärzte').map(c=>c.n)],a.arzt)}</select>
  <div class="row"><div style="flex:1"><label>Seit</label><input id="d_seit" type="date" value="${a.seit}"></div><div style="flex:1"><label>ICD-10 (optional)</label><input id="d_icd" value="${esc(a.icd)}"></div></div>
  ${a.st==='unbestätigt'?'<div class="warn mu" style="margin-top:8px">Unbestätigt, wird nicht als gesicherte Diagnose dargestellt.</div>':''}</div><h2>Verlauf (${tl.length})</h2>${tl.map(x=>x.h).join('')||'<div class="mu">Noch keine Einträge.</div>'}`}
 if(dxSub==='bef')b=`${a.bef.slice().sort((x,y)=>y.d-x.d).map(x=>`<div class="note"><b>${esc(x.ty)}</b> · ${fmt(x.d)}<br>${esc(x.t)}</div>`).join('')||'<div class="mu">Noch keine Befunde.</div>'}
  <h2>Anhängen</h2><div class="card"><label style="margin-top:0">Titel</label><input id="bt"><div class="row"><div style="flex:1"><label>Art</label><select id="bty">${opts(['Befund','Arztbrief','Medikation','Sonstiges'],'Befund')}</select></div><div style="flex:1"><label>Datum</label><input id="bd" type="date" value="${iso(day(0))}"></div></div>
  <button class="p s" data-addb="1" style="margin-top:12px">Anhängen</button><div class="mu" style="margin-top:8px">Im Prototyp ohne Datei-Upload.</div></div>`;
 if(dxSub==='notes')b=`${a.notes.slice().sort((x,y)=>y.d-x.d).map(n=>`<div class="note"><b>${esc(n.u)}</b> · ${fmt(n.d)}<br>${esc(n.t)}</div>`).join('')||'<div class="mu">Noch keine Notizen.</div>'}
  <h2>Notiz hinzufügen</h2><div class="card"><textarea id="an" style="min-height:80px" placeholder="Beobachtung, Gesprächsnotiz …"></textarea><button class="p s" data-addn="1" style="margin-top:10px">Speichern</button></div>`;
 return nav+head+sub+b}

function draftsUI(){if(!drafts.length)return '<div class="card mu">Keine Entwürfe. Aktive Vorlagen legst du in den Einstellungen fest.</div>';
 let i=drafts.findIndex(x=>x.tid===dTab);if(i<0)i=0;const d=drafts[i];dTab=d.tid;
 return `${tabs(drafts.map(x=>[x.tid,(x.s==='Entwurf'?'':'✓ ')+esc(x.name)]),d.tid,'dr')}
 <div class="card"><div class="row sp"><b>${esc(d.name)}</b><span class="badge">${d.s}</span></div><div class="mu ${d.ok?'':'warn'}">An: ${esc(d.to)}</div>
 <label for="b${i}">Betreff</label><input id="b${i}" data-subj="${i}" value="${esc(d.sub)}"><label for="x${i}">Text</label><textarea id="x${i}" data-body="${i}">${esc(d.body)}</textarea>
 <div class="row" style="margin-top:10px"><button class="s" data-cp="${i}">Kopieren</button><button class="s" data-sent="${i}">Als gesendet markieren</button></div></div>`}
function vTrip(){const n=days();
 const rows=meds.map(m=>{let need='–',gap='–',note='';if(m.day==null)note='Einnahmeplan unbestätigt, keine Berechnung';else{need=m.day*n;if(m.stock==null)note='Bestand unbekannt, bitte prüfen';else{const g=Math.max(0,need-m.stock);gap=g;note=g?`Fehlmenge, ca. ${Math.ceil(g/m.pack)} Packung(en) zu prüfen`:'Bestand reicht'}}
  return `<tr><td>${esc(m.n)}</td><td>${need}</td><td>${m.stock??'?'}</td><td>${gap}</td><td class="${note.startsWith('Bestand reicht')?'ok':'warn'}">${note}</td></tr>`}).join('');
 return `<div class="card"><div class="row"><div style="flex:1"><label style="margin-top:0" for="tf">Reisebeginn</label><input id="tf" type="date" value="${trip.from}"></div><div style="flex:1"><label style="margin-top:0" for="tt">Reiseende</label><input id="tt" type="date" value="${trip.to}"></div></div>
 <label for="tg">Grund (optional)</label><input id="tg" value="${esc(trip.grund)}" placeholder="z. B. Familienbesuch, Kur">
 <div class="mu" style="margin-top:8px">${n?`Zeitraum: <b>${n} Tage</b>`:'<span class="err">Bitte gültigen Zeitraum wählen</span>'}</div></div>
 <div class="row sp"><h2>E-Mail-Entwürfe</h2><button class="s gh" data-tab="settings" data-set="mail">Vorlagen ändern</button></div>
 ${draftsUI()}
 <div class="mu">Es wird nichts versendet. „Gesendet“ markiert ihr selbst.</div>
 <h2>Medikamente</h2><div class="card wrap"><table><tr><th>Name</th><th>Bedarf</th><th>Bestand</th><th>Fehl</th><th>Hinweis</th></tr>${rows}</table></div>
 <div class="mu">Planungshilfe, keine ärztliche Aussage. Fehlende Angaben werden gekennzeichnet statt geschätzt.</div>`}

function vSet(){const head=tabs([['mail','E-Mail-Entwürfe'],['konto','Person']],setTab,'sett');
 if(setTab==='konto')return `${head}<div class="card"><b>Ich bin</b><div class="mu" style="margin:2px 0 8px">Aufgaben und Einträge werden dieser Person zugeordnet.</div>${chips(PE.map(p=>[p,p]),user,'login')}</div>`;
 const k=tpls.find(x=>x.id===tplSel)||tpls[0],names=[...new Set(contacts.filter(c=>c.m).map(c=>c.n))];
 return `${head}<div class="row sp" style="margin-bottom:6px"><span class="mu">Aktive Vorlagen (✓) erzeugen im Urlaubsassistenten einen Entwurf.</span><button class="s" data-newt="1">＋ Vorlage</button></div>
 ${tabs(tpls.map(t=>[t.id,(t.on?'✓ ':'')+esc(t.n)]),k.id,'tpl')}
 <div class="card"><label style="margin-top:0"><input type="checkbox" id="tp_on" ${k.on?'checked':''} style="width:auto;min-height:0"> Bei Urlaub einen Entwurf erstellen</label>
 <label for="tp_n">Name</label><input id="tp_n" value="${esc(k.n)}">
 <label for="tp_to">Empfänger (Kontakte mit E-Mail)</label><select id="tp_to"><option value="">– bitte wählen –</option>${names.map(n=>`<option ${n===k.to?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <label for="tp_sub">Betreff</label><input id="tp_sub" value="${esc(k.sub)}"><label for="tp_body">Text</label><textarea id="tp_body">${esc(k.body)}</textarea>
 <div class="mu" style="margin-top:8px">Platzhalter: {von} {bis} {tage} {grund}. Zeilen mit {grund} entfallen, wenn kein Grund eingetragen ist. Keine Gesundheitsdetails im Betreff.</div></div>`}

function vLogin(){return `<div style="margin-top:56px;text-align:center"><div class="hn" style="color:var(--tx);text-shadow:none">Wer bist du?</div><div class="mu" style="margin:4px 0 24px">Danach siehst du deine Aufgaben. Das lässt sich jederzeit oben ändern.</div>
 <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">${PE.map(p=>`<button class="p" style="min-height:48px;font-size:16px" data-login="${p}">${p}</button>`).join('')}</div></div>`}
function render(){
 $('#hu').innerHTML=user?`<button class="s" data-logout="1" aria-label="Person wechseln">👤 ${esc(user)} · wechseln</button><button class="s gh" data-tab="settings" aria-label="Einstellungen">⚙️</button>`:'';
 $('#nv').hidden=!user;if(!user){$('#v').innerHTML=vLogin();return}
 const T=[['start','Start','🏠'],['aufgaben','Aufgaben','✅'],['termine','Termine','📅'],['kontakte','Kontakte','📇'],['diagnosen','Diagnosen','🩺'],['urlaub','Urlaub','✈️']];
 $('#nav').innerHTML=T.map(([k,n,ic])=>`<button data-tab="${k}" aria-current="${tab===k}"><span>${ic}</span>${n}</button>`).join('');
 const TT={aufgaben:'Aufgaben',termine:'Termine',kontakte:'Kontakte',diagnosen:'Diagnosen',urlaub:'Urlaub',settings:'Einstellungen'};
 const A={termine:`<button class="p s" data-newap="1">${showNewA?'Abbrechen':'＋ Termin'}</button>`,aufgaben:`<button class="p s" data-new="1">${showNew?'Abbrechen':'＋ Aufgabe'}</button>`,kontakte:`<button class="p s" data-newk="1">${showNewK?'Abbrechen':'＋ Kontakt'}</button>`,diagnosen:`<button class="p s" data-dt="${dxTab==='new'?'overview':'new'}">${dxTab==='new'?'Abbrechen':'＋ Diagnose'}</button>`}[tab]||'';
 $('#v').innerHTML=(tab==='start'?'':`<div class="ph2"><h1 class="pt">${TT[tab]}</h1>${A}</div>`)+{start:vStart,aufgaben:vTasks,termine:vTermine,kontakte:vContacts,diagnosen:vDx,urlaub:vTrip,settings:vSet}[tab]();
 if(tab==='kontakte')kList()}
document.addEventListener('click',e=>{const b=e.target.closest('button');
 if(!b){const ap=e.target.closest('[data-opena]');if(ap&&!e.target.closest('select,input,textarea,label,.ed,a')){const id=ap.dataset.opena;openA=openA===id?null:id;showNewA=false;aerr='';apf=openA?apfFrom(appts.find(x=>x.id===id)):null;render();return}
 const c=e.target.closest('[data-open]');if(c&&!e.target.closest('select,input,textarea,label,.ed')){openT=openT==+c.dataset.open?null:+c.dataset.open;render()}return}
 const d=b.dataset;
 if(d.dr){dTab=d.dr;return render()}
 if(d.at){aTab=d.at;return render()}
 if(d.newap){showNewA=!showNewA;openA=null;aerr='';apf=showNewA?apfNew():null;return render()}
 if(d.goarzt){readForm();tab='kontakte';showNewK=true;kcl='Ärzte';ksub='alle';kerr='';return render()}
 if(d.apsave){const f=readForm();if(!f.arzt||!f.what.trim()||!f.date){aerr='Bitte Arzt, Anlass und Datum angeben.';return render()}
  let rp=null;if(f.rep!=='none'){rp=f.rep==='custom'?{n:Math.max(1,parseInt(f.n)||1),u:f.u}:{n:parseInt(f.rep),u:f.rep.slice(-1)}}
  const rec={arzt:f.arzt,what:f.what.trim(),date:f.date,time:f.time,rep:rp,rem:+f.rem,note:f.note.trim()};
  if(d.apsave==='new'){appts.push({id:'p'+nid++,...rec});showNewA=false;L(`Termin angelegt: ${rec.what}`)}else{Object.assign(appts.find(x=>x.id===d.apsave),rec);openA=null;L(`Termin geändert: ${rec.what}`)}
  aerr='';apf=null;return render()}
 if(d.apt){const a=appts.find(x=>x.id===d.apt),o=nextOcc(a)||new Date(a.date+'T00:00');tasks.unshift({id:nid++,t:`Termin: ${a.what} (${arztName(a)}) am ${fmt(o)}`,th:'Gesundheit',who:user,st:0,pr:'mittel',c:[]});L(`Aufgabe aus Termin angelegt: ${a.what}`);return render()}
 if(d.login){user=d.login;tab='start';try{localStorage.setItem('pz_user',user)}catch(_){}L('Person gewählt');return render()}
 if(d.logout){user=null;openT=null;try{localStorage.removeItem('pz_user')}catch(_){}return render()}
 if(d.tab){tab=d.tab;del=null;if(d.set)setTab=d.set;return render()}
 if(d.tp){tp=d.tp;return render()}
 if(d.th){tth=d.th;return render()}
 if(d.tpl){tplSel=d.tpl;return render()}
 if(d.new){showNew=!showNew;return render()}
 if(d.newk){showNewK=!showNewK;kerr='';return render()}
 if(d.sd){showDone=!showDone;return render()}
 if(d.sa){showArch=!showArch;return render()}
 if(d.kc){kcl=d.kc;ksub='alle';del=null;return render()}
 if(d.ks){ksub=d.ks;del=null;return render()}
 if(d.dt){dxTab=d.dt;dxSub='info';del=null;return render()}
 if(d.ds){dxSub=d.ds;return render()}
 if(d.sett){setTab=d.sett;return render()}
 if(d.del){del=d.del;return render()}
 if(d.delno){del=null;return render()}
 if(d.delyes){const[k,id]=del.split(':');
  if(k==='c'){const c=contacts.find(x=>x.id===id);contacts.splice(contacts.indexOf(c),1);mkDrafts();L(`Kontakt gelöscht: ${c.n}`)}
  if(k==='t'){const a=appts.find(x=>x.id===id);appts.splice(appts.indexOf(a),1);openA=null;apf=null;L(`Termin gelöscht: ${a.what}`)}
  if(k==='d'){const a=dxs.find(x=>x.id===id);dxs.splice(dxs.indexOf(a),1);dxTab='overview';L(`Diagnose gelöscht: ${a.n}`)}
  del=null;return render()}
 if(d.newt){const id='t'+nid++;tpls.push({id,n:'Neue Vorlage',on:false,to:'',sub:'',body:''});tplSel=id;L('Vorlage angelegt');return render()}
 if(d.addk){const v=i=>$('#'+i).value.trim(),n=v('nk_n'),t=v('nk_t');if(!n||!t){kerr='Bitte Name und Telefonnummer eintragen.';return render()}
  const cl=$('#nk_cl').value,c={id:'k'+nid++,n,r:v('nk_r')||'–',cl,t};if(cl==='Immobilie')c.sub=$('#nk_sub').value;if(v('nk_m'))c.m=v('nk_m');
  contacts.push(c);kerr='';showNewK=false;kcl='alle';kq='';L(`Kontakt angelegt: ${n}`);return render()}
 if(b.id==='add'){const t=$('#nt').value.trim();if(!t){$('#err').textContent='Bitte einen Titel eingeben.';return}
  tasks.unshift({id:nid++,t,th:$('#nth').value,who:$('#nw').value,st:0,pr:'mittel',c:[]});showNew=false;L(`Aufgabe angelegt: ${t}`);return render()}
 if(d.save){const k=tasks.find(x=>x.id==d.save),t=$('#e_t').value.trim()||k.t;L(`Aufgabe geändert: „${k.t}“ (Zuständig: ${$('#e_w').value}, Thema: ${$('#e_th').value})`);Object.assign(k,{t,th:$('#e_th').value,who:$('#e_w').value,pr:$('#e_p').value});openT=null;return render()}
 if(d.arch){const k=tasks.find(x=>x.id==d.arch);k.arch=true;openT=null;L(`Aufgabe archiviert: ${k.t}`);return render()}
 if(d.unarch){const k=tasks.find(x=>x.id==d.unarch);k.arch=false;L(`Aufgabe wiederhergestellt: ${k.t}`);return render()}
 if(d.cm){const x=$('#c_x').value.trim();if(!x)return;const k=tasks.find(y=>y.id==d.cm);k.c.push({u:user,t:new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}),x});L(`Kommentar zu „${k.t}“`);return render()}
 if(d.addn){const t=$('#an').value.trim();if(!t)return;const a=dxs.find(x=>x.id===dxTab);a.notes.push({u:user,d:new Date(),t});L(`Notiz in „${a.n}“`);return render()}
 if(d.addb){const t=$('#bt').value.trim();if(!t)return;const a=dxs.find(x=>x.id===dxTab);a.bef.push({t,ty:$('#bty').value,d:new Date($('#bd').value)});L(`${$('#bty').value} angehängt in „${a.n}“`);return render()}
 if(d.newa){const n=$('#na').value.trim();if(!n)return;const id='a'+nid++;dxs.push({id,n,st:'unbestätigt',arzt:'–',seit:'',icd:'',next:null,notes:[],bef:[]});dxTab=id;dxSub='info';L(`Diagnose-Cluster angelegt: ${n}`);return render()}
 if(d.cp!==undefined){const x=drafts[d.cp],txt=`${x.sub}\n\n${x.body}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()});
  x.s='Kopiert';L(`Entwurf kopiert: ${x.name}`);return render()}
 if(d.sent!==undefined){drafts[d.sent].s='Als gesendet markiert';L(`Als gesendet markiert: ${drafts[d.sent].name}`);render()}});
document.addEventListener('change',e=>{const t=e.target,id=t.id||'';
 if(id==='ap_rep'){readForm();render();return}
 if(t.dataset.st){const k=tasks.find(x=>x.id==t.dataset.st),o=ST[k.st];k.st=+t.value;L(`„${k.t}“: ${o} → ${ST[k.st]}`);render()}
 if(id==='tf'||id==='tt'||id==='tg'){trip[id==='tf'?'from':id==='tt'?'to':'grund']=t.value;mkDrafts();render()}
 if(id.startsWith('tp_')){const k=tpls.find(x=>x.id===tplSel);if(id==='tp_on')k.on=t.checked;else k[id.slice(3)]=t.value;mkDrafts();L(`Vorlage „${k.n}“ geändert`);render()}
 if(id.startsWith('d_')){const a=dxs.find(x=>x.id===dxTab),f={d_st:'st',d_arzt:'arzt',d_seit:'seit',d_icd:'icd'}[id];a[f]=t.value;L(`„${a.n}“: ${f} geändert`);render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='kq'){kq=t.value;kList()}
 if(t.dataset.subj)drafts[t.dataset.subj].sub=t.value;if(t.dataset.body)drafts[t.dataset.body].body=t.value});
render();
</script>
</body>
</html>
